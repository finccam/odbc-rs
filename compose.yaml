services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "OdbcRs-TestFixture1!"
    ports:
      - "127.0.0.1:1433:1433"
    healthcheck:
      test:
        - CMD-SHELL
        - 'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "SELECT 1" > /dev/null'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    # Deliberately no volumes: removing the container discards the database.

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2025-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: "OdbcRs-TestFixture1!"
    entrypoint: /opt/mssql-tools18/bin/sqlcmd
    command:
      - -S
      - sqlserver
      - -U
      - sa
      - -C
      - -b
      - -Q
      - "IF DB_ID(N'dbitest') IS NULL CREATE DATABASE [dbitest];"
    restart: "no"
