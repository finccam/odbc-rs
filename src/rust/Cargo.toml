[package]
name = 'odbc_rs'
publish = false
version = '0.1.0'
edition = '2021'
rust-version = '1.88'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'odbc_rs'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
extendr-api = '0.9.0'
odbc-api = { version = '29', default-features = false, features = ['odbc_version_3_80'] }
ouroboros = '0.18'
chrono = { version = '0.4', default-features = false, features = ['std'] }
chrono-tz = '0.10'

[profile.release]
lto = true
codegen-units = 1
